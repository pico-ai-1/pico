<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="robots" content="noindex,nofollow,noarchive" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#3d8b4d" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>피코와 나눈 대화 모음</title>
<style>
  :root {
    --bg: #f3f5f3;
    --surface: #ffffff;
    --border: #e1e6e1;
    --text: #1c221d;
    --muted: #667068;
    --accent: #3d8b4d;
    --accent-soft: #e7f4ea;
    --chip-bg: #eef1ee;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    line-height: 1.5;
  }
  .wrap {
    max-width: 520px;
    margin: 0 auto;
    padding: 0 0 70px;
  }
  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(255,255,255,0.94);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px 10px;
  }
  .topbar-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 9px;
  }
  .avatar {
    width: 32px;
    height: 32px;
    border-radius: 9px;
    background: #67b868;
    color: #fff;
    font-weight: 800;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .brand-title { font-size: 16px; font-weight: 800; }
  .brand-sub { font-size: 11px; color: var(--muted); }
  .search-input {
    width: 100%;
    padding: 9px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    font-size: 13px;
    outline: none;
    margin-bottom: 8px;
  }
  .chips {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 2px;
    scrollbar-width: none;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    border: none;
    background: var(--chip-bg);
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    padding: 6px 11px;
    border-radius: 999px;
    white-space: nowrap;
    cursor: pointer;
  }
  .chip.active {
    background: var(--accent);
    color: #fff;
  }

  .section-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    padding: 16px 16px 8px;
  }

  /* 목차 리스트 */
  .toc-box {
    margin: 0 14px 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
  }
  .toc-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 11px 14px;
    border-bottom: 1px solid var(--border);
    text-decoration: none;
    color: inherit;
    cursor: pointer;
  }
  .toc-row:last-child { border-bottom: none; }
  .toc-row:active { background: var(--accent-soft); }
  .toc-left { min-width: 0; }
  .toc-date {
    font-size: 11px;
    color: var(--accent);
    font-weight: 700;
  }
  .toc-title {
    font-size: 14px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .toc-go {
    font-size: 12px;
    color: var(--accent);
    font-weight: 700;
    flex-shrink: 0;
  }

  /* 대화 상세 카드 */
  .cards {
    padding: 0 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px 15px;
    scroll-margin-top: 132px;
    transition: box-shadow 0.35s ease, transform 0.25s ease;
  }
  .card.flash {
    box-shadow: 0 0 0 3px #f6c945, 0 8px 20px rgba(246, 201, 69, 0.28);
    transform: scale(1.01);
  }
  .card-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
  }
  .card-date {
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
  }
  .card-cat {
    font-size: 11px;
    color: var(--muted);
    background: var(--bg);
    padding: 2px 8px;
    border-radius: 999px;
  }
  .card-title {
    font-size: 15px;
    font-weight: 800;
    margin-bottom: 8px;
  }
  .bubble-q {
    background: var(--accent-soft);
    color: #1e4b28;
    border-radius: 12px;
    padding: 8px 11px;
    font-size: 13px;
    margin-bottom: 8px;
  }
  .bubble-a {
    font-size: 13px;
    color: var(--text);
    line-height: 1.55;
  }
  .bubble-a ul {
    margin: 6px 0 0;
    padding-left: 18px;
  }
  .bubble-a li { margin-bottom: 3px; }
  .empty {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    padding: 36px 16px;
  }
  .top-fab {
    position: fixed;
    right: 16px;
    bottom: 18px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 10px 15px;
    font-size: 13px;
    font-weight: 700;
    box-shadow: 0 4px 14px rgba(0,0,0,0.2);
    cursor: pointer;
    z-index: 30;
  }

  .toggle-chat-btn {
    margin-top: 10px;
    width: 100%;
    border: 1px solid #cce6d1;
    background: var(--accent-soft);
    color: var(--accent);
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .toggle-chat-btn:active { opacity: 0.85; }
  .chat-log {
    display: none;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--border);
    flex-direction: column;
    gap: 8px;
  }
  .chat-log.open {
    display: flex;
  }
  .c-row {
    display: flex;
    align-items: flex-end;
    gap: 5px;
  }
  .c-row.user { justify-content: flex-end; }
  .c-row.bot { justify-content: flex-start; }
  .c-bub {
    max-width: 82%;
    padding: 8px 11px;
    border-radius: 14px;
    font-size: 12.5px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .c-row.user .c-bub {
    background: var(--accent);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .c-row.bot .c-bub {
    background: #f1f4f1;
    color: var(--text);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .c-time {
    font-size: 10px;
    color: var(--muted);
    flex-shrink: 0;
  }

</style>

<style>
  /* ---- 잠금 화면 ---- */
  body.locked { overflow: hidden; }
  body.locked .wrap, body.locked .top-fab { display: none; }
  .lock-screen {
    position: fixed; inset: 0; z-index: 200; background: var(--bg);
    display: flex; align-items: center; justify-content: center; padding: 22px;
    -webkit-overflow-scrolling: touch;
  }
  body:not(.locked) .lock-screen { display: none; }
  .lock-card {
    width: 100%; max-width: 340px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 20px;
    padding: 26px 22px 20px; text-align: center;
    box-shadow: 0 12px 34px rgba(28,34,29,.08);
  }
  .lock-avatar {
    width: 54px; height: 54px; border-radius: 16px; background: #67b868;
    color: #fff; font-weight: 800; font-size: 26px; margin: 0 auto 14px;
    display: flex; align-items: center; justify-content: center;
  }
  .lock-title { margin: 0 0 6px; font-size: 18px; font-weight: 800; letter-spacing: -.2px; }
  .lock-sub { margin: 0 0 18px; font-size: 12.5px; color: var(--muted); line-height: 1.55; }
  .lock-input {
    width: 100%; padding: 13px 8px; border-radius: 12px;
    border: 1.5px solid var(--border); background: var(--bg);
    font-size: 22px; font-weight: 800; color: var(--text); outline: none;
    letter-spacing: .45em; text-indent: .45em; text-align: center;
    font-family: inherit; transition: border-color .15s ease, background .15s ease;
  }
  .lock-input:focus { border-color: var(--accent); background: #fff; }
  .lock-card.bad .lock-input { border-color: #d9534f; animation: lockshake .34s ease; }
  @keyframes lockshake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-7px); }
    40% { transform: translateX(7px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }
  .lock-remember {
    display: flex; align-items: center; justify-content: center; gap: 7px;
    margin: 15px 0 2px; font-size: 12.5px; color: var(--muted); cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .lock-remember input { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }
  .lock-btn {
    width: 100%; margin-top: 14px; padding: 13px; border: none; border-radius: 12px;
    background: var(--accent); color: #fff; font-size: 14px; font-weight: 800;
    font-family: inherit; cursor: pointer;
  }
  .lock-btn:disabled { opacity: .55; }
  .lock-msg { min-height: 17px; margin-top: 11px; font-size: 12px; color: #d9534f; font-weight: 700; }
  .lock-foot { margin: 13px 0 0; font-size: 10.5px; color: var(--muted); line-height: 1.5; }
  .relock-btn {
    border: none; background: var(--chip-bg); color: var(--muted);
    font-size: 11px; font-weight: 700; padding: 5px 9px; border-radius: 999px;
    font-family: inherit; cursor: pointer;
  }
</style>
</head>

<script>
  let items = [];
  let chatsById = {};

  let activeCat = "전체";
  const tocBox = document.getElementById("tocBox");
  const cardsBox = document.getElementById("cards");
  const tocLabel = document.getElementById("tocLabel");
  const searchInput = document.getElementById("searchInput");

  function jumpToCard(id) {
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ behavior: "smooth", block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;
    el.classList.add("flash");
    setTimeout(() => el.classList.remove("flash"), 1600);
  }

  function render() {
    const q = searchInput.value.trim().toLowerCase();
    const list = items.filter(it => {
      const catOk = activeCat === "전체" || it.cat === activeCat;
      const text = (it.title + " " + it.q + " " + it.a.join(" ")).toLowerCase();
      return catOk && (!q || text.includes(q));
    });

    tocLabel.textContent = `📑 대화 목차 (${list.length}건)`;
    tocBox.innerHTML = "";
    cardsBox.innerHTML = "";

    if (list.length === 0) {
      tocBox.innerHTML = `<div class="empty">일치하는 대화가 없어요.</div>`;
      return;
    }

    list.forEach(it => {
      const row = document.createElement("div");
      row.className = "toc-row";
      row.innerHTML = `
        <div class="toc-left">
          <div class="toc-date">${it.date} · ${it.cat}</div>
          <div class="toc-title">${it.title}</div>
        </div>
        <div class="toc-go">보기 ›</div>
      `;
      row.onclick = () => jumpToCard(it.id);
      tocBox.appendChild(row);

      const card = document.createElement("div");
      card.className = "card";
      card.id = it.id;
      const msgs = it.chats || chatsById[it.id] || [];
      const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
      const chatHtml = msgs.map(m => m.r === "user"
        ? `<div class="c-row user"><span class="c-time">${m.t}</span><div class="c-bub">${esc(m.m)}</div></div>`
        : `<div class="c-row bot"><div class="c-bub">${esc(m.m)}</div><span class="c-time">${m.t}</span></div>`
      ).join("");

      card.innerHTML = `
        <div class="card-meta">
          <span class="card-date">${it.date}</span>
          <span class="card-cat">${it.cat}</span>
        </div>
        <div class="card-title">${it.title}</div>
        <div class="bubble-q">💬 ${it.q}</div>
        <div class="bubble-a">
          <ul>${it.a.map(x => `<li>${x}</li>`).join("")}</ul>
        </div>
        ${msgs.length ? `
          <button class="toggle-chat-btn" type="button">
            <span>💬 실제 대화 보기 (${msgs.length}개)</span>
            <span class="chev">펼치기 ▾</span>
          </button>
          <div class="chat-log">${chatHtml}</div>
        ` : ""}
      `;
      const tBtn = card.querySelector(".toggle-chat-btn");
      if (tBtn) {
        tBtn.onclick = () => {
          const log = card.querySelector(".chat-log");
          const isOpen = log.classList.toggle("open");
          tBtn.querySelector(".chev").textContent = isOpen ? "접기 ▴" : "펼치기 ▾";
        };
      }
      cardsBox.appendChild(card);
    });
  }

  document.getElementById("chips").addEventListener("click", e => {
    const btn = e.target.closest(".chip");
    if (!btn) return;
    document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
    btn.classList.add("active");
    activeCat = btn.dataset.cat;
    render();
  });

  searchInput.addEventListener("input", render);

  window.__boot = function (data) {
    items = data.items;
    chatsById = data.chatsById;
    render();
  };

<script>
(function () {
  "use strict";
  var P = JSON.parse(document.getElementById("payload").textContent);
  var STORE = "picoChatKey.v1";
  var lock = document.getElementById("lockScreen");
  var card = document.getElementById("lockCard");
  var form = document.getElementById("lockForm");
  var input = document.getElementById("pwInput");
  var msg = document.getElementById("lockMsg");
  var btn = document.getElementById("unlockBtn");
  var remember = document.getElementById("remember");
  var PINLEN = (P.ui && P.ui.pin) || 0;
  var busy = false;

  function b64d(s) {
    var b = atob(s), u = new Uint8Array(b.length);
    for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);
    return u;
  }
  function b64e(u) {
    var s = "";
    for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]);
    return btoa(s);
  }

  function derive(pw) {
    var raw = new TextEncoder().encode(pw);
    return crypto.subtle.importKey("raw", raw, "PBKDF2", false, ["deriveKey"])
      .then(function (km) {
        return crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: b64d(P.salt), iterations: P.iter, hash: "SHA-256" },
          km, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
      });
  }
  function open(key) {
    return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64d(P.iv) }, key, b64d(P.ct))
      .then(function (buf) { return JSON.parse(new TextDecoder().decode(buf)); });
  }

  function relock(clearStore) {
    if (clearStore) { try { localStorage.removeItem(STORE); } catch (e) {} }
    location.reload();
  }

  function show(data) {
    document.body.classList.remove("locked");
    lock.style.display = "none";
    try { window.__boot(data); } catch (e) { console.error(e); }
    var head = document.querySelector(".topbar-head");
    if (head && !document.getElementById("relockBtn")) {
      var b = document.createElement("button");
      b.id = "relockBtn";
      b.className = "relock-btn";
      b.type = "button";
      b.textContent = "🔒 잠금";
      b.title = "이 기기 기억 삭제하고 잠그기";
      b.onclick = function () { relock(true); };
      head.appendChild(b);
    }
  }

  function fail(text) {
    msg.textContent = text;
    card.classList.remove("bad");
    void card.offsetWidth;
    card.classList.add("bad");
    input.value = "";
    input.focus();
  }

  function unlock(pw) {
    if (busy) return;
    busy = true;
    btn.disabled = true;
    msg.textContent = "";
    var keyRef = null;
    derive(pw).then(function (key) {
      keyRef = key;
      return open(key);
    }).then(function (data) {
      if (!remember.checked) return data;
      return crypto.subtle.exportKey("raw", keyRef).then(function (raw) {
        try {
          localStorage.setItem(STORE, JSON.stringify({
            salt: P.salt, k: b64e(new Uint8Array(raw))
          }));
        } catch (e) {}
        return data;
      }, function () { return data; });
    }).then(function (data) {
      busy = false; btn.disabled = false;
      show(data);
    }).catch(function () {
      busy = false; btn.disabled = false;
      fail("비밀번호가 맞지 않아요.");
    });
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    if (!input.value) { fail("비밀번호를 입력해 주세요."); return; }
    unlock(input.value);
  });
  input.addEventListener("input", function () {
    msg.textContent = "";
    card.classList.remove("bad");
    if (PINLEN && input.value.length > PINLEN) input.value = input.value.slice(0, PINLEN);
    if (PINLEN && input.value.length === PINLEN) unlock(input.value);
  });

  // 이 기기에서 기억하기: 저장된 키로 바로 열기
  (function () {
    if (!window.crypto || !crypto.subtle) {
      msg.textContent = "HTTPS 주소로 열어 주세요.";
      return;
    }
    var saved = null;
    try { saved = localStorage.getItem(STORE); } catch (e) {}
    if (!saved) { input.focus(); return; }
    var s;
    try { s = JSON.parse(saved); } catch (e) { localStorage.removeItem(STORE); input.focus(); return; }
    if (!s || s.salt !== P.salt || !s.k) { localStorage.removeItem(STORE); input.focus(); return; }
    msg.textContent = "잠금 해제 중...";
    crypto.subtle.importKey("raw", b64d(s.k), "AES-GCM", true, ["decrypt"])
      .then(open)
      .then(function (data) { msg.textContent = ""; show(data); })
      .catch(function () {
        try { localStorage.removeItem(STORE); } catch (e) {}
        msg.textContent = "";
        input.focus();
      });
  })();

  input.focus();
})();
</script>
